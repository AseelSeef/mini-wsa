services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: mini_wsa
      POSTGRES_USER: mini_wsa
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mini_wsa -d mini_wsa"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
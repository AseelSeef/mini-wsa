services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: mini_wsa
      POSTGRES_USER: mini_wsa
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mini_wsa -d mini_wsa"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/mini_wsa
      SPRING_DATASOURCE_USERNAME: mini_wsa
      SPRING_DATASOURCE_PASSWORD: local_dev_password
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  postgres_data:
spring.application.name=mini-wsa
spring.datasource.url=jdbc:postgresql://localhost:5432/mini_wsa
spring.datasource.username=mini_wsa
spring.datasource.password=local_dev_password
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY}
spring.ai.anthropic.chat.model=claude-sonnet-5-5
spring.ai.anthropic.chat.max-tokens=1024
logging.level.org.springframework.ai=DEBUG
